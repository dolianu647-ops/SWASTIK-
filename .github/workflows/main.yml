name: Build SWASTIK Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK and AAB
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Settings files ==="
          find . -name settings.gradle -print
          echo "=== Gradle build ==="
          gradle assembleDebug bundleRelease --stacktrace --info

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SWASTIK-Android-Build
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/bundle/release/*.aab
