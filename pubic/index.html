<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15161a"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><title>SWASTIK</title><style>
:root{--bg:#f4f5f8;--card:#fff;--text:#16171b;--muted:#747983;--line:#e4e6ec;--accent:#17181c;--soft:#f0efff;--danger:#d63b50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:64px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 max(14px,calc((100vw - 1120px)/2))}.brand{display:flex;gap:10px;align-items:center;font-weight:900;letter-spacing:.5px}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#111 url("/icon-192.png") center/cover no-repeat;color:#fff;font-weight:900;box-shadow:0 8px 20px #7c5cff2b}.search{flex:1;max-width:470px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:10px 15px;outline:0}.btn{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:750}.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.wrap{max-width:1120px;margin:22px auto;display:grid;grid-template-columns:220px minmax(0,1fr) 240px;gap:22px;padding:0 14px}.panel,.post,.composer{background:var(--card);border:1px solid var(--line);border-radius:18px}.left{height:max-content;padding:10px;position:sticky;top:84px}.nav{width:100%;border:0;background:transparent;padding:12px;border-radius:11px;text-align:left;margin:2px 0;color:var(--text)}.nav:hover,.nav.active{background:var(--soft)}.composer{padding:14px;margin-bottom:16px}.composer textarea{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg);outline:0}.row{display:flex;align-items:center;gap:10px;margin-top:10px}.row.between{justify-content:space-between}.file{max-width:72%}.post{overflow:hidden;margin-bottom:16px}.head{display:flex;align-items:center;gap:10px;padding:13px}.avatar,.tiny{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#ff7b24,#c03cff,#2c8cff);color:#fff;font-weight:850}.avatar{width:66px;height:66px;font-size:24px;margin:auto}.tiny{width:38px;height:38px}.body{padding:0 13px 15px}.postimg{display:block;width:100%;max-height:520px;object-fit:cover;background:#eef0f7}.actions{display:flex;gap:15px;padding:10px 13px 0}.iconbtn{border:0;background:none;font-size:23px;padding:4px;color:var(--text)}.liked{color:#e33}.comment{display:flex;gap:8px;margin:8px 0}.comment b{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.commentbox{display:flex;gap:8px;margin-top:11px}.commentbox input,.form input,.form textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--bg);outline:0}.profilecard{text-align:center;padding:18px}.suggest{padding:15px}.suggestion{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.suggestion:last-child{border-bottom:0}.empty{text-align:center;padding:44px 15px;color:var(--muted)}.titlebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{display:inline-block;min-width:20px;padding:2px 6px;border-radius:999px;background:#e9e3ff;font-size:11px;text-align:center}.notice{padding:12px;border-bottom:1px solid var(--line)}.conversation{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.conversation:hover{background:var(--bg)}.messages{min-height:380px;display:flex;flex-direction:column}.chatlog{flex:1;max-height:430px;overflow:auto;padding:14px}.bubble{max-width:78%;padding:9px 12px;border-radius:14px;margin:7px 0;background:var(--bg);width:max-content}.mine{margin-left:auto;background:var(--soft)}.chatinput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:40;padding:16px}.modalbox{width:min(430px,100%);background:var(--card);border-radius:18px;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{flex:1;border:0;border-radius:10px;padding:10px;background:var(--bg)}.tab.on{background:var(--accent);color:#fff}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:60;max-width:90%;text-align:center}.form{display:grid;gap:9px}.profileedit{display:grid;gap:8px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:10px 0}@media(max-width:900px){.wrap{grid-template-columns:1fr;max-width:680px}.left,.right{display:none}.search{max-width:none}.top{padding:0 10px}.brand span{display:none}}@media(max-width:520px){.top{gap:8px}.search{width:100%;font-size:14px}.postimg{max-height:430px}.file{max-width:62%}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark" aria-label="SWASTIK logo"></div><span>SWASTIK</span></div><input class="search" id="search" placeholder="Search people or posts"><button class="btn" id="authBtn">Login</button></header>
<div class="wrap"><aside class="left panel"><button class="nav active" data-view="home">🏠 Home</button><button class="nav" data-view="explore">🔎 Explore</button><button class="nav" data-view="profile">👤 Profile</button><button class="nav" data-view="notifications">🔔 Notifications <span id="notifBadge"></span></button><button class="nav" data-view="messages">💬 Messages</button><hr><button class="nav" id="logoutBtn">↪ Logout</button></aside><main id="main"></main><aside class="right panel"><div class="profilecard"><div class="avatar" id="sideAvatar">S</div><h3 id="sideName">Guest</h3><div class="small" id="sideUser">Login to create posts</div><button class="btn ghost" id="sideProfile" style="margin-top:10px">View profile</button></div><div class="suggest"><b>People to follow</b><div id="suggestions"></div></div></aside></div>
<div class="modal" id="authModal"><div class="modalbox"><div class="tabs"><button class="tab on" id="loginTab">Login</button><button class="tab" id="signupTab">Sign up</button></div><div class="form"><input id="nameInput" placeholder="Display name" style="display:none"><input id="userInput" placeholder="Username"><input id="passInput" type="password" placeholder="Password"><button class="btn" id="authSubmit">Login</button><button class="btn ghost" id="closeAuth">Close</button></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s); let me=null, view='home', authMode='login', activeChat=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1900)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function refresh(){me=(await api('/api/me')).user;$('#authBtn').textContent=me?'Logout':'Login';$('#sideName').textContent=me?me.displayName:'Guest';$('#sideUser').textContent=me?'@'+me.username:'Login to create posts';$('#sideAvatar').textContent=me?me.avatar:'S';}
function switchView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render().catch(e=>toast(e.message))}
function composer(){return me?`<section class="composer"><textarea id="caption" maxlength="500" placeholder="Share something on SWASTIK…"></textarea><div class="row between"><input class="file" id="image" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn" id="postBtn">Post</button></div></section>`:''}
function postHtml(p){const own=me&&p.author.id===me.id;return `<article class="post"><div class="head"><div class="tiny">${esc(p.author.avatar)}</div><div><b>@${esc(p.author.username)}</b><div class="small">${new Date(p.createdAt).toLocaleString()}</div></div>${own?`<button class="btn danger" style="margin-left:auto;padding:8px 10px" data-delete="${p.id}">Delete</button>`:''}</div>${p.image?`<img class="postimg" loading="lazy" src="${p.image}" alt="Post by ${esc(p.author.username)}">`:''}<div class="actions"><button class="iconbtn ${p.liked?'liked':''}" data-like="${p.id}">${p.liked?'♥':'♡'}</button><button class="iconbtn" onclick="document.querySelector('[data-comment-input=\\"${p.id}\\"]').focus()">💬</button><button class="iconbtn" onclick="navigator.clipboard?.writeText(location.origin)">↗</button></div><div class="body"><b>${p.likes} likes</b>${p.caption?`<p><b>${esc(p.author.username)}</b> ${esc(p.caption)}</p>`:''}<div>${p.comments.map(c=>`<div class="comment"><b>${esc(c.user.username)}</b><span>${esc(c.text)}</span></div>`).join('')}</div><div class="commentbox"><input data-comment-input="${p.id}" maxlength="300" placeholder="Write a comment…"><button class="btn" data-comment="${p.id}">Send</button></div></div></article>`}
async function renderFeed(){const main=$('#main');main.innerHTML=composer()||'';const q=view==='explore'?$('#search').value.trim():'';const d=await api('/api/feed?limit=20'+(q?'&q='+encodeURIComponent(q):''));if(!d.posts.length)main.insertAdjacentHTML('beforeend','<section class="panel empty">No posts yet.</section>');else main.insertAdjacentHTML('beforeend',d.posts.map(postHtml).join(''));bindFeed(d.posts)}
function bindFeed(posts){$('#postBtn')?.addEventListener('click',createPost);posts.forEach(p=>{document.querySelector(`[data-like="${p.id}"]`)?.addEventListener('click',async()=>{if(!me)return openAuth();try{await api('/api/posts/'+p.id+'/like',{method:'POST'});await render()}catch(e){toast(e.message)}});document.querySelector(`[data-comment="${p.id}"]`)?.addEventListener('click',async()=>{if(!me)return openAuth();const i=document.querySelector(`[data-comment-input="${p.id}"]`);try{await api('/api/posts/'+p.id+'/comments',{method:'POST',body:JSON.stringify({text:i.value})});await render()}catch(e){toast(e.message)}});document.querySelector(`[data-delete="${p.id}"]`)?.addEventListener('click',async()=>{if(confirm('Delete this post?'))try{await api('/api/posts/'+p.id,{method:'DELETE'});await render()}catch(e){toast(e.message)}})})}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1200/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function createPost(){const cap=$('#caption')?.value.trim()||'';const file=$('#image')?.files[0];let image=null;if(file){if(file.size>8*1024*1024)return toast('Choose an image under 8 MB.');image=await resizeImage(file)}try{await api('/api/posts',{method:'POST',body:JSON.stringify({caption:cap,image})});toast('Posted successfully');await render()}catch(e){toast(e.message)}}
async function renderProfile(){const main=$('#main');if(!me){main.innerHTML='<section class="panel empty"><h2>Login first</h2><button class="btn" id="goLogin">Login / Sign up</button></section>';$('#goLogin').onclick=()=>openAuth();return}const d=await api('/api/users/'+encodeURIComponent(me.username));main.innerHTML=`<section class="panel profilecard"><div class="avatar">${esc(d.user.avatar)}</div><h2>${esc(d.user.displayName)}</h2><div class="muted">@${esc(d.user.username)}</div><p>${esc(d.user.bio||'No bio yet.')}</p><div class="small">${d.user.followers} followers · ${d.user.followingCount} following</div><div class="profileedit"><input id="editName" value="${esc(d.user.displayName)}" maxlength="40"><textarea id="editBio" maxlength="160" placeholder="Bio">${esc(d.user.bio||'')}</textarea><button class="btn" id="saveProfile">Save profile</button></div></section><div style="height:12px"></div>${d.posts.map(postHtml).join('')||'<section class="panel empty">No posts yet.</section>'}`;$('#saveProfile').onclick=async()=>{try{const d2=await api('/api/users/'+encodeURIComponent(me.username),{method:'PATCH',body:JSON.stringify({displayName:$('#editName').value,bio:$('#editBio').value})});me=d2.user;await refresh();toast('Profile saved')}catch(e){toast(e.message)}};bindFeed(d.posts)}
async function loadSuggestions(){const d=await api('/api/users');$('#suggestions').innerHTML=d.users.filter(u=>!me||u.id!==me.id).slice(0,4).map(u=>`<div class="suggestion"><span><b>${esc(u.displayName)}</b><br><span class="small">@${esc(u.username)}</span></span><button class="btn" data-follow="${u.id}">${u.following?'Following':'Follow'}</button></div>`).join('');document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{if(!me)return openAuth();try{const d2=await api('/api/users/'+b.dataset.follow+'/follow',{method:'POST'});b.textContent=d2.following?'Following':'Follow'}catch(e){toast(e.message)}})}
async function renderNotifications(){if(!me){$('#main').innerHTML='<section class="panel empty">Login to see notifications.</section>';return}const d=await api('/api/notifications');$('#main').innerHTML='<section class="panel"><div class="titlebar" style="padding:15px"><h2 style="margin:0">Notifications</h2><button class="btn ghost" id="readAll">Mark read</button></div>'+ (d.notifications.map(n=>`<div class="notice"><b>${esc(n.from?.displayName||'Someone')}</b> ${n.type==='follow'?'followed you':n.type==='like'?'liked your post':n.type==='comment'?'commented on your post':'sent you a message'}<div class="small">${new Date(n.createdAt).toLocaleString()}</div></div>`).join('')||'<div class="empty">No notifications.</div>')+'</section>';$('#readAll').onclick=async()=>{await api('/api/notifications/read',{method:'POST'});renderNotifications()}}
async function renderMessages(){const main=$('#main');if(!me){main.innerHTML='<section class="panel empty">Login to use messages.</section>';return}const d=await api('/api/conversations');main.innerHTML=`<section class="panel"><div class="titlebar" style="padding:15px"><h2 style="margin:0">Messages</h2><button class="btn" id="newChat">New chat</button></div><div id="convList">${d.conversations.map(c=>`<div class="conversation" data-conv="${c.id}"><b>${esc(c.other?.displayName||'User')}</b><div class="small">${esc(c.last?.text||'Start a conversation')}</div></div>`).join('')||'<div class="empty">No conversations yet.</div>'}</div></section>`;document.querySelectorAll('[data-conv]').forEach(x=>x.onclick=()=>openChat(x.dataset.conv));$('#newChat').onclick=async()=>{const u=prompt('Enter username to message:');if(!u)return;try{const c=await api('/api/conversations',{method:'POST',body:JSON.stringify({username:u})});openChat(c.conversation.id)}catch(e){toast(e.message)}}}
async function openChat(id){activeChat=id;const d=await api('/api/conversations/'+id+'/messages');$('#main').innerHTML=`<section class="panel messages"><div class="titlebar" style="padding:14px"><b>Chat</b><button class="btn ghost" id="backChats">Back</button></div><div class="chatlog" id="chatlog">${d.messages.map(m=>`<div class="bubble ${m.user.id===me.id?'mine':''}">${esc(m.text)}<div class="small">${new Date(m.createdAt).toLocaleTimeString()}</div></div>`).join('')||'<div class="empty">Say hello 👋</div>'}</div><div class="chatinput"><input id="chatText" maxlength="1000" placeholder="Message…"><button class="btn" id="sendMsg">Send</button></div></section>`;$('#backChats').onclick=()=>renderMessages();$('#sendMsg').onclick=sendMsg;$('#chatText').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});scrollChat()}
async function sendMsg(){const t=$('#chatText').value.trim();if(!t)return;try{await api('/api/conversations/'+activeChat+'/messages',{method:'POST',body:JSON.stringify({text:t})});await openChat(activeChat)}catch(e){toast(e.message)}}
function scrollChat(){const e=$('#chatlog');if(e)e.scrollTop=e.scrollHeight}
function openAuth(mode='login'){authMode=mode;$('#authModal').style.display='grid';$('#loginTab').classList.toggle('on',mode==='login');$('#signupTab').classList.toggle('on',mode==='signup');$('#nameInput').style.display=mode==='signup'?'block':'none';$('#authSubmit').textContent=mode==='login'?'Login':'Create account'}
$('#closeAuth').onclick=()=>$('#authModal').style.display='none';$('#loginTab').onclick=()=>openAuth('login');$('#signupTab').onclick=()=>openAuth('signup');$('#authBtn').onclick=async()=>{if(!me)return openAuth();await api('/api/auth/logout',{method:'POST'});me=null;await refresh();await loadSuggestions();switchView('home');toast('Logged out')};$('#logoutBtn').onclick=()=>$('#authBtn').click();$('#sideProfile').onclick=()=>switchView('profile');$('#authSubmit').onclick=async()=>{try{const body={username:$('#userInput').value,password:$('#passInput').value};let d;if(authMode==='signup'){body.displayName=$('#nameInput').value;d=await api('/api/auth/signup',{method:'POST',body:JSON.stringify(body)})}else d=await api('/api/auth/login',{method:'POST',body:JSON.stringify(body)});me=d.user;$('#authModal').style.display='none';$('#passInput').value='';await refresh();await loadSuggestions();toast('Welcome to SWASTIK');switchView('home')}catch(e){toast(e.message)}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){view='explore';switchView('explore')}});
async function updateBadge(){if(!me){$('#notifBadge').textContent='';return}const d=await api('/api/notifications');const n=d.notifications.filter(x=>!x.read).length;$('#notifBadge').textContent=n?` <span class="badge">${n}</span>`:''}
async function render(){if(view==='profile')await renderProfile();else if(view==='notifications')await renderNotifications();else if(view==='messages')await renderMessages();else await renderFeed();await loadSuggestions();await updateBadge()}
(async()=>{try{await refresh();await render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){toast(e.message)}})();
</script></body></html>
